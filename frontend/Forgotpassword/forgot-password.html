<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | VigCraft Testing Hub</title>
  <meta name="description" content="Reset your VigCraft Testing Hub password. Enter your email address and we'll send a secure link to create a new password." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="../css/forgot-password.css" />
</head>
<body class="auth-page">

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <main id="main-content" class="auth-layout">
    <section class="auth-card" aria-labelledby="forgot-password-heading">

      <header class="auth-card__header">
        <a href="./login.html" class="auth-logo" aria-label="VigCraft Testing Hub — back to login">
          <svg class="auth-logo__mark" width="40" height="40" viewBox="0 0 40 40" role="img" aria-hidden="true" focusable="false">
            <rect width="40" height="40" rx="10" class="auth-logo__mark-bg"></rect>
            <path d="M11 13 L20 27 L29 13" class="auth-logo__mark-glyph" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="auth-logo__text">VigCraft</span>
        </a>

        <h1 id="forgot-password-heading" class="auth-card__title">Forgot your password?</h1>
        <p class="auth-card__description">
          Enter the email address linked to your account and we'll send you a link to reset your password.
        </p>
      </header>

      <div id="form-status" class="auth-alert" role="status" aria-live="polite" hidden></div>

      <form id="forgot-password-form" class="auth-form" novalidate autocomplete="on">
        <div class="form-field">
          <label for="email" class="form-field__label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-field__input"
            placeholder="you@company.com"
            autocomplete="email"
            inputmode="email"
            maxlength="254"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
            aria-required="true"
            aria-invalid="false"
            aria-describedby="email-error"
          />
          <span id="email-error" class="form-field__error" role="alert"></span>
        </div>

        <button type="submit" id="submit-button" class="btn btn--primary btn--block" aria-describedby="form-status">
          <span class="btn__label">Send Reset Link</span>
          <span class="btn__spinner" aria-hidden="true" hidden></span>
        </button>
      </form>

      <footer class="auth-card__footer">
        <a href="./login.html" class="auth-link">
          <span class="auth-link__icon" aria-hidden="true">&larr;</span>
          Back to Login
        </a>
      </footer>

    </section>
  </main>

  <script src="../js/forgot-password.js" defer></script>
</body>
</html>
